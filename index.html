<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin">
    <title>OUDHIRA - Premium Agarwood Vape</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body.age-restricted {
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }
        .app-hide{
            display: none;
        }
        .age-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .age-video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #age-bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.5);
        }
        .age-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #fff;
            padding: 30px;
        }
        .btn-gold { 
            background: #e3ccae;
            color: #000; 
            padding: 12px 30px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
            border-radius: 8px;
        }
        .btn-gray { 
            background: rgba(255,255,255,0.1); 
            color: #fff; 
            padding: 12px 30px; 
            border: 1px solid rgba(255,255,255,0.2); 
            cursor: pointer;
            border-radius: 8px;
        }
        .hero-video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
            background: #000;
            overflow: hidden;
        }
        .hero-video-container iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }
        .back-to-top {
            position: fixed;
            bottom: 60px;
            right: 60px;
            width: 85px; 
            height: 85px;
            z-index: 999;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s;
            overflow: hidden;
        }
        .back-to-top.show {
            opacity: 1;
            visibility: visible;
        }
        .lang-menu{
            display: none;
            position: absolute;
            top: 100%;
            right:0;
            background:#222;
            padding:10px;
        }
        .lang-switcher:hover .lang-menu{
            display:block;
        }
    </style>
</head>
<body class="age-restricted">

<!-- 年龄验证 -->
<div id="age-verification" class="age-overlay">
    <div class="age-video-container">
        <video autoplay muted loop playsinline id="age-bg-video">
            <source src="public/videos/age-bg.mp4" type="video/mp4">
        </video>
    </div>
    <div class="age-content">
        <img src="public/images/logo.png" alt="Logo" height="80">
        <h2>Are you under 18 years old?</h2>
        <div style="display:flex;gap:15px;justify-content:center;margin-top:20px;">
            <button class="btn-gray" onclick="handleAgeYes()">Yes</button>
            <button class="btn-gold" onclick="handleAgeNo()">No, I'm over.</button>
        </div>
    </div>
</div>

<script>
function handleAgeYes(){window.location='https://google.com';}
function handleAgeNo(){
    document.body.classList.remove('age-restricted');
    document.getElementById('app-wrapper').classList.remove('app-hide');
    document.getElementById('age-verification').style.display='none';
    sessionStorage.setItem('age-verified','true');
}
document.addEventListener('DOMContentLoaded',()=>{
    if(sessionStorage.getItem('age-verified')==='true') handleAgeNo();
    window.addEventListener('scroll',()=>{
        const btn=document.getElementById('backToTop');
        window.scrollY>300 ? btn.classList.add('show') : btn.classList.remove('show');
    });
});
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}
function changeLanguage(lang){sessionStorage.setItem('siteLang',lang);location.reload();}
</script>

<div id="app-wrapper" class="app-hide">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><a href="#home"><img src="public/images/logo.png" alt="Logo"></a></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="heritage.html">Brand Story</a>
                <a href="products.html">Products</a>
                <a href="experience.html">Experience</a>
                <a href="#contact">Contact</a>
            </div>
            <div class="lang-switcher">
                <i class="fas fa-globe"></i>
                <div class="lang-menu">
                    <a onclick="changeLanguage('en')">English</a>
                    <a onclick="changeLanguage('ar')">العربية</a>
                    <a onclick="changeLanguage('ja')">日本語</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ✅ 终极修复：YouTube 视频（Netlify 100%不报错） -->
    <section class="hero" id="home">
        <div class="hero-video-container">
            <iframe 
                src="https://www.youtube.com/embed/eAM0xr5j6vw?autoplay=1&mute=1&loop=1&playlist=eAM0xr5j6vw&controls=0"
                frameborder="0"
                allow="autoplay; encrypted-media"
                referrerpolicy="origin"
                allowfullscreen>
            </iframe>
        </div>
    </section>

    <section class="contact" id="contact">
        <h2>Get In Touch</h2>
        <p>johnny@oudhira.com</p>
    </section>

    <footer>
        <p>&copy; 2026 OUDHIRA. All rights reserved.</p>
    </footer>
</div>

<div class="back-to-top" id="backToTop" onclick="scrollToTop()">
    <img src="public/images/Breathing.png" alt="Top">
</div>
</body>
</html>
